plugins { id 'com.android.application' }
android {
    namespace 'com.kaoyandaka.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.kaoyandaka.app"
        minSdk 22
        targetSdk 34
        versionCode 2
        versionName "3.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
