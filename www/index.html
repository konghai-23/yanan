<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>研岸 · 考研自习</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.55;font-size:15px;-webkit-font-smoothing:antialiased}
:root{
 --bg:#eef1f7;--card:#ffffff;--card2:#f6f8fc;--text:#1b2432;--muted:#66758c;
 --border:#e3e8f0;--accent:#4f6df5;--accent2:#0ea5a0;--accent-soft:rgba(79,109,245,.12);
 --ok:#16803c;--ok-bg:#e5f6ec;--warn:#b45309;--warn-bg:#fdf1dd;--bad:#c53030;--bad-bg:#fdeaea;
 --shadow:0 1px 2px rgba(16,24,40,.05),0 10px 26px -14px rgba(16,24,40,.14);
 --radius:16px;
}
html[data-theme=dark]{
 --bg:#0d131f;--card:#151d2c;--card2:#1b2436;--text:#e7ecf5;--muted:#94a1b8;--border:#28334a;
 --accent:#6f8bff;--accent2:#2fd4c5;--accent-soft:rgba(111,139,255,.18);
 --ok:#34d399;--ok-bg:rgba(52,211,153,.15);--warn:#fbbf24;--warn-bg:rgba(251,191,36,.15);--bad:#f87171;--bad-bg:rgba(248,113,113,.15);
 --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -16px rgba(0,0,0,.55);
}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 90px}
.topbar{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topbar-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:var(--shadow)}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px;margin-left:auto}
.tab{border:0;background:transparent;color:var(--muted);font-weight:600;padding:7px 15px;border-radius:9px;transition:.15s}
.tab:hover{color:var(--text)}
.tab.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px -2px var(--accent)}
.view{display:none;animation:fade .2s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card + .card{margin-top:16px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:16px;font-weight:700}
.card-h .hint{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
.section-title{font-size:15px;font-weight:700;margin:0 0 6px}
.sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0 16px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-height:86px;cursor:default}
.stat.clickable{cursor:pointer;transition:.15s}
.stat.clickable:hover{border-color:var(--accent);transform:translateY(-1px)}
.stat .lab{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .num{font-size:22px;font-weight:800;letter-spacing:.3px}
.stat .sub{font-size:12px;color:var(--muted)}
.stat .num small{font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2 > .card{margin-top:0}
@media(max-width:900px){.grid2{grid-template-columns:1fr}.grid2 > .card{margin-top:0}.grid2 > .card + .card{margin-top:16px}}
.rowline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mt10{margin-top:10px}.mt16{margin-top:16px}
.muted{color:var(--muted);font-size:13px}
.small{font-size:12.5px}
.in,select.in,textarea.in{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;outline:none;transition:.15s;width:100%}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{resize:vertical;min-height:64px}
select.in{width:auto;min-width:110px}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:0 0 4px;font-weight:600}
.field{margin-bottom:10px}
.btn{border:1px solid transparent;border-radius:10px;padding:8px 14px;font-weight:600;background:var(--card2);color:var(--text);border-color:var(--border);transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08);color:#fff}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.ok:hover{filter:brightness(1.08);color:#fff}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.bad:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--card2)}
.btn.mini{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.iconbtn{border:0;background:transparent;color:var(--muted);padding:4px 7px;border-radius:8px;font-size:14px}
.iconbtn:hover{background:var(--card2);color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.tagchip{background:var(--card2);color:var(--muted);border:1px solid var(--border)}
.datebar{display:flex;align-items:center;gap:8px;margin:14px 0 0;flex-wrap:wrap}
.datebar .dlabel{font-weight:800;font-size:16px}
.datebar .spacer{flex:1}
.pbar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;width:100%}
.pbar>i{display:block;height:100%;border-radius:99px;transition:width .3s}
.ringwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{position:relative;width:150px;height:150px;border-radius:50%;flex:none}
.ring::after{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--card)}
.ring .ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;text-align:center}
.ring .ringtxt b{font-size:20px}
.ring .ringtxt span{font-size:11px;color:var(--muted)}
.pomo-time{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:1px}
.phasebadge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.phasebadge.rest{background:var(--ok-bg);color:var(--ok)}
.list{display:flex;flex-direction:column}
.listrow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px dashed var(--border)}
.listrow:last-child{border-bottom:0}
.task-done .t-content{text-decoration:line-through;color:var(--muted)}
.task-ab .t-content{color:var(--muted);opacity:.65}
.t-main{flex:1;min-width:0}
.t-content{word-break:break-all}
.t-meta{font-size:12px;color:var(--muted);margin-top:1px}
.check{width:22px;height:22px;flex:none;border-radius:7px;border:2px solid var(--border);background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;cursor:pointer;transition:.15s}
.check:hover{border-color:var(--ok)}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}
.donutwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px;flex:1;min-width:180px}
.legend .li{display:flex;align-items:center;gap:8px}
.legend .li .nm{flex:1;color:var(--muted)}
.barchart{display:flex;align-items:flex-end;gap:4px;height:210px;padding:0 2px}
.bc-col{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0}
.bc-track{width:100%;max-width:34px;height:170px;display:flex;align-items:flex-end;justify-content:center}
.bc-bar{width:70%;min-width:3px;border-radius:4px 4px 0 0;background:var(--accent);transition:height .3s}
.bc-lab{font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;max-width:100%;text-overflow:ellipsis}
.chartnote{padding:26px;text-align:center;color:var(--muted);font-size:13px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:11px}
.bar-row{display:flex;align-items:center;gap:10px;margin:7px 0}
.bar-row .nm{width:96px;flex:none;font-size:13px;display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .val{width:52px;flex:none;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar-row .trk{flex:1;height:10px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar-row .trk>i{display:block;height:100%;border-radius:99px}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.qa-box{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px;white-space:pre-wrap;word-break:break-all}
.qa-box img{max-width:100%;max-height:340px;border-radius:10px;margin-top:8px;display:block;border:1px solid var(--border)}
.qa-img{margin-top:10px}
.qa-img img{max-width:100%;max-height:300px;border-radius:10px;border:1px solid var(--border)}
.hist{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hdot{width:18px;height:18px;border-radius:6px;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:800}
.hdot.r{background:var(--ok-bg);color:var(--ok)}
.hdot.w{background:var(--bad-bg);color:var(--bad)}
.rate{font-variant-numeric:tabular-nums;font-weight:700}
.rate.ok{color:var(--ok)}.rate.warn{color:var(--warn)}.rate.bad{color:var(--bad)}
.meter{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.meter>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.meter.warn>i{background:var(--warn)}
.meter.full>i{background:var(--bad)}
.settings-sub{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.settings-sub input[type=color]{width:36px;height:32px;border:1px solid var(--border);border-radius:8px;background:var(--card2);padding:2px;cursor:pointer}
.settings-sub input[type=text]{flex:1;min-width:120px}
.settings-sub .del{flex:none}
.toastwrap{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow);animation:toastIn .2s ease;max-width:90vw;text-align:center}
html[data-theme=dark] .toast{background:#e8ecf5;color:#10151f}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.review-ctls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.bigbtn{flex:1;min-width:150px;padding:14px;border-radius:14px;border:0;font-weight:800;font-size:16px;color:#fff;transition:.15s;box-shadow:var(--shadow)}
.bigbtn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.bigbtn.ok{background:var(--ok)}.bigbtn.bad{background:var(--bad)}
.bigbtn.flat{background:var(--card2);color:var(--muted);border:1px solid var(--border)}
.detail-box{background:var(--card2);border:1px dashed var(--border);border-radius:12px;padding:12px 14px;margin-top:8px;font-size:13.5px}
.numsmall{width:70px}
.badge-due{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px}
.badge-due.due{background:var(--bad-bg);color:var(--bad)}
.badge-due.soon{background:var(--warn-bg);color:var(--warn)}
.badge-due.later{background:var(--card2);color:var(--muted)}
.badge-due.master{background:var(--ok-bg);color:var(--ok)}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mini-stat{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:12px 14px}
.mini-stat .lab{font-size:12px;color:var(--muted)}
.mini-stat .num{font-size:20px;font-weight:800;margin-top:2px}
.mini-stat .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.reveal-hide{display:none}
kbd.hintkey{font-size:11px;color:var(--muted);background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:1px 6px}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:600;padding:5px 14px;border-radius:8px}
.seg button.on{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}
.note-line{font-size:12.5px;color:var(--muted);background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;margin-bottom:12px}
#toastwrap{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
</style>

<script>
'use strict';/* ============ 常量与工具 ============ */
const LS_KEY='kaoyan_daka_v1';

const MAX_BYTES=5*1024*1024;
let _seq=Date.now()%1000000;
function uid(){ _seq++; return 'k'+_seq.toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

function parseYMD(s){ var a=s.split('-'); return new Date(+a[0],+a[1]-1,+a[2]); }
function addDays(s,n){ var d=parseYMD(s); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function diffDays(a,b){ return Math.round((parseYMD(b)-parseYMD(a))/86400000); }
function fmtCN(s){ var d=parseYMD(s); var wd=['日','一','二','三','四','五','六'][d.getDay()]; return (d.getMonth()+1)+'月'+d.getDate()+'日 周'+wd; }
function fmtCNshort(s){ var d=parseYMD(s); return (d.getMonth()+1)+'/'+d.getDate(); }
function fmtMin(m){ m=Math.round(m||0); if(m<60)return m+'分钟'; var h=Math.floor(m/60),mm=m%60; return mm? h+'小时'+mm+'分' : h+'小时'; }
function fmtDur(m){ m=Math.round(m||0); if(m<60)return m+'分钟'; var h=Math.floor(m/60),mm=m%60; return mm? h+'h'+String(mm).padStart(2,'0')+'m' : h+'h'; }
function pctStr(c,t){ if(!t)return null; return Math.round(c/t*1000)/10; }
function fmtHM(ts){ var d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function escDl(s){ return s.replace(/"/g,'&quot;'); }

/* ============ 默认数据 ============ */
function defaultSubjects(){ return [
 {id:'pol',name:'政治',color:'#e5484d'},
 {id:'eng',name:'英语',color:'#3b82f6'},
 {id:'math',name:'数学',color:'#f59e0b'},
 {id:'maj',name:'专业课',color:'#8b5cf6'}
]; }
function defaultSettings(){ return {subjects:defaultSubjects(),dailyGoalMin:480,pomodoro:{focus:25,short:5,long:15,longEvery:4},reviewIntervals:FALLBACK_INTERVALS.slice(),examDate:'',theme:'light',useDailyBg:true}; }
function defaultData(){ return {version:1,settings:defaultSettings(),days:{},mistakes:[]}; }
function defaultTimer(){ return {phase:'idle',running:false,startTs:0,accMs:0,subjectId:'',tag:'',streak:0,dur:null}; }
let data=defaultData();
let timer=defaultTimer();
let ui={tab:'home',viewDate:todayStr(),statsRange:7,mEditId:null,mOpenId:null,mFilter:{subject:'all',status:'all'},review:null,pendingBreak:null,pomoTick:null};

/* ============ 规范化 ============ */
function normTask(t){ return {id:String(t.id||uid()),subjectId:String(t.subjectId||''),content:String(t.content||''),plannedMin:t.plannedMin==null?null:clampInt(t.plannedMin,0,1440,null),status:['todo','done','abandoned'].indexOf(t.status)>=0?t.status:'todo',ts:t.ts||Date.now()}; }
function normPractice(p){ var total=clampInt(p.total,1,9999,1); return {id:String(p.id||uid()),subjectId:String(p.subjectId||''),tag:String(p.tag||''),correct:Math.min(clampInt(p.correct,0,9999,0),total),total:total,ts:p.ts||Date.now()}; }
function normSession(s){ return {id:String(s.id||uid()),subjectId:String(s.subjectId||''),tag:String(s.tag||''),minutes:clampInt(s.minutes,0,1440,0),ts:s.ts||Date.now(),source:s.source==='manual'?'manual':'pomodoro'}; }
function normMistake(m){
 if(!m||typeof m!=='object')return null;
 var iv=reviewIntervals();
 var rec={id:String(m.id||uid()),subjectId:String(m.subjectId||''),tag:String(m.tag||''),question:String(m.question||''),answer:String(m.answer||''),reason:String(m.reason||''),image:(typeof m.image==='string'&&m.image.indexOf('data:image/')===0)?m.image:null,
    aImage:(typeof m.aImage==='string'&&m.aImage.indexOf('data:image/')===0)?m.aImage:null,createdAt:/^\d{4}-\d{2}-\d{2}$/.test(m.createdAt||'')?m.createdAt:todayStr(),stage:clampInt(m.stage,0,999,0),dueDate:null,mastered:!!m.mastered,history:Array.isArray(m.history)?m.history.filter(function(h){return h&&typeof h==='object';}).map(function(h){return {date:/^\d{4}-\d{2}-\d{2}$/.test(h.date||'')?h.date:todayStr(),correct:!!h.correct};}):[]};
 if(rec.mastered){ rec.dueDate=null; }
 else{ rec.stage=Math.min(rec.stage,iv.length-1); var dd=(/^\d{4}-\d{2}-\d{2}$/.test(m.dueDate||'')?m.dueDate:addDays(rec.createdAt,iv[rec.stage]||1)); rec.dueDate=dd<rec.createdAt?addDays(rec.createdAt,iv[rec.stage]||1):dd; }
 return rec;
}
function normalizeData(o){
 var d=defaultData(); if(!o||typeof o!=='object')return d;
 var s=o.settings||{};
 d.settings.subjects=(Array.isArray(s.subjects)&&s.subjects.length?s.subjects:d.settings.subjects).map(function(x){x=x||{};return {id:String(x.id||uid()),name:String(x.name||'科目')||'科目',color:/^#[0-9a-fA-F]{6}$/.test(x.color||'')?x.color:'#64748b'};});
 d.settings.dailyGoalMin=clampInt(s.dailyGoalMin,1,1440,480);
 var p=s.pomodoro||{};
 d.settings.pomodoro={focus:clampInt(p.focus,1,180,25),short:clampInt(p.short,1,60,5),long:clampInt(p.long,1,120,15),longEvery:clampInt(p.longEvery,1,12,4)};
 var iv=Array.isArray(s.reviewIntervals)?s.reviewIntervals.map(function(v){return clampInt(v,1,365,1);}):null;
 if(!iv||!iv.length)iv=FALLBACK_INTERVALS.slice();
 d.settings.reviewIntervals=iv;
 d.settings.examDate=/^\d{4}-\d{2}-\d{2}$/.test(s.examDate||'')?s.examDate:'';
 d.settings.theme=['auto','light','dark'].indexOf(s.theme)>=0?s.theme:'auto';
  d.settings.useDailyBg = s.useDailyBg===undefined ? true : !!s.useDailyBg;
 d.days={};
 if(o.days&&typeof o.days==='object'){ Object.keys(o.days).forEach(function(k){ if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&o.days[k]&&typeof o.days[k]==='object'){ var dd=o.days[k]; d.days[k]={tasks:(Array.isArray(dd.tasks)?dd.tasks:[]).map(normTask),practice:(Array.isArray(dd.practice)?dd.practice:[]).map(normPractice),sessions:(Array.isArray(dd.sessions)?dd.sessions:[]).map(normSession),note:String(dd.note||'')}; } }); }
 d.mistakes=(Array.isArray(o.mistakes)?o.mistakes:[]).map(normMistake).filter(Boolean);
 return d;
}
function storeGet(k){ try{ if(typeof localStorage!=='undefined')return localStorage.getItem(k); }catch(e){} return null; }
function storeSet(k,v){ try{ if(typeof localStorage!=='undefined'){ localStorage.setItem(k,v); return true; } }catch(e){} return false; }
function storeDel(k){ try{ if(typeof localStorage!=='undefined')localStorage.removeItem(k); }catch(e){} }
function loadData(){ try{ var raw=storeGet(LS_KEY); if(raw)data=normalizeData(JSON.parse(raw)); }catch(e){ console.error('数据读取失败',e); } }
function save(){ storeSet(LS_KEY,JSON.stringify(data)); updateStoreMeter(); }
function saveTimer(){ storeSet(LS_TIMER,JSON.stringify(timer)); }
function loadTimer(){ try{ var raw=storeGet(LS_TIMER); if(raw){ var t=JSON.parse(raw); timer=Object.assign(defaultTimer(),t||{}); } }catch(e){} }
function reviewIntervals(){ return data.settings.reviewIntervals&&data.settings.reviewIntervals.length?data.settings.reviewIntervals:FALLBACK_INTERVALS.slice(); }

/* ============ 科目 ============ */
function subj(id){ for(var i=0;i<data.settings.subjects.length;i++){ if(data.settings.subjects[i].id===id)return data.settings.subjects[i]; } return {id:'',name:'(未知科目)',color:'#94a3b8'}; }
function subjectOptions(sel,keep){ var s=sel; s.innerHTML=''; data.settings.subjects.forEach(function(x){ var o=document.createElement('option'); o.value=x.id; o.textContent=x.name; s.appendChild(o); }); if(keep&&data.settings.subjects.some(function(x){return x.id===keep;}))s.value=keep; else if(data.settings.subjects.length)s.value=data.settings.subjects[0].id; }
function chipHtml(sid){ var x=subj(sid); return '<span class="chip" style="background:'+x.color+'22;color:'+x.color+'"><span class="dot"></span>'+esc(x.name)+'</span>'; }/* ============ 某天记录 ============ */
function dayRec(date){ if(!data.days[date])data.days[date]={tasks:[],practice:[],sessions:[],note:''}; return data.days[date]; }
function dateExists(date){ return !!(data.days[date]); }
function todaySessions(){ return dayRec(todayStr()).sessions; }
function todayFocusMin(){ var m=0; todaySessions().forEach(function(s){m+=s.minutes||0;}); return m; }

/* ============ 错题复习算法 ============ */
function mistakeDue(m){ return !m.mastered && m.dueDate<=todayStr(); }
function dueMistakes(){ return data.mistakes.filter(mistakeDue); }
function activeMistakes(){ return data.mistakes.filter(function(m){return !m.mastered;}); }
function reviewCorrect(m){
 m.history.push({date:todayStr(),correct:true});
 var iv=reviewIntervals(), next=m.stage+1;
 if(next>=iv.length){ m.mastered=true; m.dueDate=null; }
 else{ m.stage=next; m.dueDate=addDays(todayStr(),iv[next]); }
}
function reviewWrong(m){
 m.history.push({date:todayStr(),correct:false});
 m.mastered=false; m.stage=0; m.dueDate=addDays(todayStr(),reviewIntervals()[0]||1);
}
function mistakeRoundLabel(m){
 if(m.mastered)return '<span class="badge-due master">已掌握</span>';
 var iv=reviewIntervals();
 var cur=Math.min(m.stage+1,iv.length);
 return '<span class="badge-due later">第'+cur+'轮 · '+m.dueDate.slice(5).replace('-','/')+'到期</span>';
}
function dueBadge(m){
 if(m.mastered)return '';
 var today=todayStr(),d=diffDays(today,m.dueDate);
 if(d>=0){ return '<span class="badge-due due">'+(d===0?'今天到期':'已逾期'+d+'天')+'</span>'; }
 if(d<=-3)return '';
 return '<span class="badge-due soon">'+(-d)+'天后</span>';
}
function lastResultHtml(m){ var h=m.history; if(!h.length)return '<span class="muted">未复习</span>'; var last=h[h.length-1]; return '<span class="chip '+(last.correct?'tagchip':'')+'" style="'+(last.correct?'':'background:var(--bad-bg);color:var(--bad)')+'">上次'+(last.correct?'对':'错')+'</span>'; }
function roundAccuracy(roundIndex){ var tot=0,cor=0; data.mistakes.forEach(function(m){ if(m.history.length>roundIndex){ tot++; if(m.history[roundIndex].correct)cor++; } }); return {cor:cor,tot:tot}; }
function maxRounds(){ var mx=0; data.mistakes.forEach(function(m){ if(m.history.length>mx)mx=m.history.length; }); return mx; }

/* ============ 聚合统计 ============ */
function rangeDates(n){ var out=[],t=todayStr(); for(var i=n-1;i>=0;i--)out.push(addDays(t,-i)); return out; }
function aggDay(date){ var d=data.days[date]||{tasks:[],practice:[],sessions:[]}; var a={focus:0,done:0,ab:0,totalTasks:0,pCor:0,pTot:0,subjMin:{}};
 (d.sessions||[]).forEach(function(s){ a.focus+=s.minutes||0; var sid=s.subjectId||''; a.subjMin[sid]=(a.subjMin[sid]||0)+(s.minutes||0); });
 (d.tasks||[]).forEach(function(t){ a.totalTasks++; if(t.status==='done')a.done++; else if(t.status==='abandoned')a.ab++; });
 (d.practice||[]).forEach(function(p){ a.pCor+=p.correct||0; a.pTot+=p.total||0; });
 return a;
}
function rangeSummary(dates){ var s={focus:0,done:0,ab:0,totalTasks:0,pCor:0,pTot:0,daysWithTask:0,daysWithFocus:0}; var subjMin={};
 dates.forEach(function(dt){ var a=aggDay(dt); s.focus+=a.focus; s.done+=a.done; s.ab+=a.ab; s.totalTasks+=a.totalTasks; s.pCor+=a.pCor; s.pTot+=a.pTot; if(a.totalTasks)s.daysWithTask++; if(a.focus)s.daysWithFocus++; Object.keys(a.subjMin).forEach(function(k){ subjMin[k]=(subjMin[k]||0)+a.subjMin[k]; }); });
 s.subjMin=subjMin; return s;
}
function allTimeMin(){ var m=0; Object.keys(data.days).forEach(function(k){ (data.days[k].sessions||[]).forEach(function(s){m+=s.minutes||0;}); }); return m; }
function allTimePractice(){ var c=0,t=0; Object.keys(data.days).forEach(function(k){ (data.days[k].practice||[]).forEach(function(p){c+=p.correct||0;t+=p.total||0;}); }); return {cor:c,tot:t}; }
function reviewStats(){ var tot=0,cor=0; data.mistakes.forEach(function(m){ tot+=m.history.length; m.history.forEach(function(h){ if(h.correct)cor++; }); }); return {tot:tot,cor:cor}; }
function practiceBySubject(dates){ var map={}; dates.forEach(function(dt){ var d=data.days[dt]; if(!d)return; (d.practice||[]).forEach(function(p){ var k=p.subjectId; if(!map[k])map[k]={cor:0,tot:0}; map[k].cor+=p.correct; map[k].tot+=p.total; }); }); return map; }
function practiceByTag(dates){ var map={}; dates.forEach(function(dt){ var d=data.days[dt]; if(!d)return; (d.practice||[]).forEach(function(p){ var k=p.subjectId+'::'+p.tag; if(!map[k])map[k]={sid:p.subjectId,tag:p.tag,cor:0,tot:0}; map[k].cor+=p.correct; map[k].tot+=p.total; }); }); return map; }
function reviewBySubject(){ var map={}; data.mistakes.forEach(function(m){ var k=m.subjectId; if(!map[k])map[k]={cor:0,tot:0}; m.history.forEach(function(h){ map[k].tot++; if(h.correct)map[k].cor++; }); }); return map; }
function rateClass(p){ if(p==null)return ''; return p>=80?'ok':(p>=60?'warn':'bad'); }
function rateHtml(c,t){ var p=pctStr(c,t); if(p==null)return '<span class="muted">—</span>'; return '<span class="rate '+rateClass(p)+'">'+p+'%</span>'; }

/* ============ 图表 ============ */
function emptyNote(txt){ return '<div class="chartnote">'+esc(txt||'暂无数据')+'</div>'; }
function cssBars(items,opt){ opt=opt||{}; if(!items||!items.length)return emptyNote(); var max=Math.max.apply(null,items.map(function(i){return i.value;})); if(!max)return emptyNote('暂无数据');
 var n=items.length,every=opt.every||1; var showLab=function(i){ return n<=8 || i%every===0 || i===n-1; };
 var col=opt.color||'var(--accent)';
 return '<div class="barchart">'+items.map(function(it,i){ return '<div class="bc-col" title="'+escDl(it.label)+'：'+it.value+'">'+'<div class="bc-track"><div class="bc-bar" style="height:'+Math.max(2,Math.round(it.value/max*100))+'%;background:'+col+'"></div></div>'+(showLab(i)?'<div class="bc-lab">'+esc(it.label)+'</div>':'')+'</div>'; }).join('')+'</div>';
}

function tickPomo(){
  if(typeof document==='undefined')return;
  var p=timer.phase;
  if(p==='idle')return;
  if(timer.running&&remainingMs()<=0){ completePhase(); return; }
  if(ui.tab!=='home')return;
  var tt=$('#t-time');
  if(tt){
    tt.textContent=fmtClock(remainingMs());
    var dur=durMs(),el=elapsedMs();
    var pct=dur?Math.min(100,el/dur*100):0;
    var ring=$('#t-ring');
    if(ring)ring.style.background='conic-gradient(var(--accent) 0deg '+(pct*3.6).toFixed(1)+'deg, rgba(255,255,255,.16) 0deg)';
  }
}
function finalizeFocus(saveAnyway){
  var minutes=Math.round(elapsedMs()/60000);
  var date=todayStr();
  if(minutes>=1){ dayRec(date).sessions.push({id:uid(),subjectId:timer.subjectId||'',tag:timer.tag||'',minutes:minutes,ts:Date.now(),source:'pomodoro'}); save(); }
  timer.phase='idle'; timer.running=false; timer.accMs=0; timer.startTs=0; timer.dur=null; saveTimer();
  if(saveAnyway&&minutes<1)toast('本次不足 1 分钟，未记录');
  return minutes;
}
function completePhase(){
  if(timer.phase==='focus'){
    var minutes=finalizeFocus(false); beep(); notify('专注完成！','本次专注 '+minutes+' 分钟已记录');
    if(minutes>=1){ timer.streak=(timer.streak||0)+1; saveTimer(); ui.pendingBreak={long:((timer.streak)%data.settings.pomodoro.longEvery===0)}; }
    renderActive();
  } else if(timer.phase==='short'||timer.phase==='long'){
    if(timer.phase==='long')timer.streak=0;
    timer.phase='idle'; timer.running=false; timer.accMs=0; timer.startTs=0; saveTimer(); beep(); notify('休息结束','开始下一个番茄吧');
    renderPomo();
  }
}
function actionPomo(act){
  if(act==='pstart'){ if(!data.settings.subjects.length){ toast('请先在设置中添加科目'); return; } requestNotify(); timer.phase='focus'; timer.running=true; timer.startTs=Date.now(); timer.accMs=0; if(!timer.subjectId||!data.settings.subjects.some(function(s){return s.id===timer.subjectId;}))timer.subjectId=data.settings.subjects[0].id; saveTimer(); renderPomo(); }
  else if(act==='ppause'){ if(timer.running){ timer.accMs+=Date.now()-timer.startTs; timer.running=false; saveTimer(); renderPomo(); } }
  else if(act==='presume'){ timer.startTs=Date.now(); timer.running=true; saveTimer(); renderPomo(); }
  else if(act==='psave'){ var min=Math.round(elapsedMs()/60000); if(min<1){ timer.phase='idle'; timer.running=false; timer.accMs=0; saveTimer(); renderPomo(); toast('不足 1 分钟，未记录'); return; } if(confirm('已专注约 '+min+' 分钟，保存并结束？')){ finalizeFocus(true); toast('已记录 '+min+' 分钟'); renderActive(); } }
  else if(act==='pdrop'){ if(confirm('确定放弃本次专注？将不记录时长')){ timer.phase='idle'; timer.running=false; timer.accMs=0; timer.startTs=0; timer.dur=null; saveTimer(); renderPomo(); } }
  else if(act==='pskip'){ timer.phase='idle'; timer.running=false; timer.accMs=0; timer.startTs=0; saveTimer(); renderPomo(); }
  else if(act==='pbreak'){ var l=event&&event.currentTarget&&event.currentTarget.getAttribute('data-long')==='1'; var pm=data.settings.pomodoro; timer.phase=l?'long':'short'; timer.running=true; timer.startTs=Date.now(); timer.accMs=0; ui.pendingBreak=null; saveTimer(); renderPomo(); }
  else if(act==='pnext'){ ui.pendingBreak=null; timer.phase='idle'; timer.running=false; timer.accMs=0; saveTimer(); renderPomo(); }
  else if(act==='pend'){ ui.pendingBreak=null; timer.phase='idle'; timer.running=false; timer.accMs=0; timer.streak=0; timer.dur=null; saveTimer(); renderPomo(); }

function applyTint(img){
  try{
    var c=document.createElement('canvas'); c.width=8; c.height=8;
    var x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(img,0,0,8,8);
    var d=x.getImageData(0,0,8,8).data; var r=0,g=0,b=0,n=0;
    for(var i=0;i<d.length;i+=4){ if(d[i+3]>128){ r+=d[i]; g+=d[i+1]; b+=d[i+2]; n++; } }
    if(!n)return;
    r=Math.round(r/n); g=Math.round(g/n); b=Math.round(b/n);
    // 首页卡片呈现色 ≈ 图片 ×(1-0.42) + 深色底(16,22,38) ×0.42
    var cr=Math.round(16*0.42 + r*0.58);

/* ============ 随机组卷 PDF ============ */
function durlToBytes(u){ var b=atob(u.split(',')[1]); var a=new Uint8Array(b.length); for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i); return a; }
function shuffleCopy(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function buildPdf(pages){
  var enc=new TextEncoder();
  var parts=[]; var offsets=[]; var total=0;
  function addRaw(bytes){ parts.push(bytes); total+=bytes.length; }
  function addObj(bytes){ offsets.push(total); parts.push(bytes); total+=bytes.length; }
  function S(str){ return enc.encode(str); }
  addRaw(new Uint8Array([0x25,0x50,0x44,0x46,0x2D,0x31,0x2E,0x34,0x0A,0x25,0xE2,0xE3,0xCF,0xD3,0x0A]));
  offsets.push(0);
  var N=pages.length;
  var kids=[]; for(var i=0;i<N;i++)kids.push(String(3+i*3)+' 0 R');
  addObj(S('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n'));
  addObj(S('2 0 obj\n<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+N+' >>\nendobj\n'));
  for(var k=0;k<N;k++){
    var pg=pages[k]; var img=pg.bytes; var pid=3+k*3, cid=pid+1, iid=pid+2;
    addObj(S(pid+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pg.w+' '+pg.h+'] /Resources << /XObject << /Im0 '+iid+' 0 R >> >> /Contents '+cid+' 0 R >>\nendobj\n'));
    var content='q\n'+pg.w+' 0 0 '+pg.h+' 0 0 cm\n/Im0 Do\nQ';
    var cbytes=S(content);
    addObj(S(cid+' 0 obj\n<< /Length '+cbytes.length+' >>\nstream\n'));
    addRaw(cbytes);
    addRaw(S('\nendstream\nendobj\n'));
    addObj(S(iid+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+pg.w+' /Height '+pg.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+img.length+' >>\nstream\n'));
    addRaw(img);
    addRaw(S('\nendstream\nendobj\n'));
  }
  var xref=total;
  var x='xref\n0 '+offsets.length+'\n';
  x+='0000000000 65535 f \n';
  for(var m=1;m<offsets.length;m++){ x+=('0000000000'+offsets[m]).slice(-10)+' 00000 n \n'; }
  addRaw(S(x));
  addRaw(S('trailer\n<< /Size '+offsets.length+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n'));
  var out=new Uint8Array(total);
  var pos=0; for(var q=0;q<parts.length;q++){ out.set(parts[q],pos); pos+=parts[q].length; }
  return out;
}
function paperCanvas(){ var c=document.createElement('canvas'); c.width=1240; c.height=1754; return c; }
function paperCtx(c){ var x=c.getContext('2d'); x.fillStyle='#ffffff'; x.fillRect(0,0,c.width,c.height); return x; }
function wrapText(t,maxW){
  var ctx=document.createElement('canvas').getContext('2d');
  ctx.font='18px "PingFang SC","Microsoft YaHei",sans-serif';
  var out=[];
  String(t==null?'':t).split(String.fromCharCode(10)).forEach(function(seg){
    var line='';
    for(var i=0;i<seg.length;i++){
      var ch=seg.charAt(i);
      var test=line+ch;
      if(ctx.measureText(test).width>maxW&&line!==''){ out.push(line); line=ch; } else { line=test; }
    }
    if(line!=='')out.push(line); else if(seg==='')out.push('');
  });
  return out;
}
function downloadBytes(bytes,name){
  try{ window.__lastPdf={len:bytes.length,head:String.fromCharCode(bytes[0],bytes[1],bytes[2],bytes[3],bytes[4])}; }catch(e){}
  var blob=new Blob([bytes],{type:'application/pdf'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ try{ URL.revokeObjectURL(url); if(a.parentNode)a.parentNode.removeChild(a); }catch(e){} },4000);
}
async function generatePaperPDF(items,withAnswers){
  var W=1240,H=1754,M=72,fb='"PingFang SC","Microsoft YaHei",sans-serif';
  var canvas=paperCanvas(); var ctx=paperCtx(canvas);
  var pages=[]; var y=M; var first=true; var hasContent=false;
  function flushLast(){ if(hasContent)pages.push({w:canvas.width,h:canvas.height,bytes:durlToBytes(canvas.toDataURL('image/jpeg',0.82))}); }
  function flushNew(){ if(hasContent){ pages.push({w:canvas.width,h:canvas.height,bytes:durlToBytes(canvas.toDataURL('image/jpeg',0.82))}); } canvas=paperCanvas(); ctx=paperCtx(canvas); y=M; hasContent=false; first=false; }
  function ensure(h){ if(y+h>H-M && y>M){ flushNew(); } }
  function line(text,font,color,maxW,lh,align){
    ensure(lh);
    ctx.font=font; ctx.fillStyle=color; ctx.textBaseline='middle'; ctx.textAlign=align||'left';
    var lines=wrapText(text,maxW);
    if(lines.length===0)lines=[''];
    for(var i=0;i<lines.length;i++){ if(i>0){ ensure(lh); } ctx.fillText(lines[i], align==='center'?W/2:M, y+lh/2); y+=lh; hasContent=true; }
  }
  function imgBlock(durl){
    return new Promise(function(resolve){
      var im=new Image();
      im.onload=function(){
        var maxW=W-2*M, maxH=Math.min(420,H-M*2-60);
        var sc=Math.min(1,maxW/im.naturalWidth,maxH/im.naturalHeight);
        var w=Math.round(im.naturalWidth*sc), h=Math.round(im.naturalHeight*sc);
        ensure(h+12);
        ctx.drawImage(im,M,y,w,h);
        y+=h+12; hasContent=true; resolve();
      };
      im.onerror=function(){ resolve(); };
      im.src=durl;
    });
  }
  if(first){
    y=M+10;
    line('考研错题自测卷','bold 34px '+fb,'#111827',W-2*M,52,'center');
    line('共 '+items.length+' 题 · '+todayStr(),'18px '+fb,'#6b7280',W-2*M,34,'center');
    line('姓名：__________　限时：______ 分钟　得分：______','17px '+fb,'#374151',W-2*M,36,'center');
    y+=14; first=false;
  }
  var cache={};
  for(var i=0;i<items.length;i++){
    var it=items[i];
    var subjName=subj(it.subjectId).name;
    line('题目 '+(i+1)+'　['+subjName+(it.tag?' · '+it.tag:'')+']','bold 21px '+fb,'#111827',W-2*M,46,'left');
    line(it.question||'','18px '+fb,'#1f2937',W-2*M,32,'left');
    if(it.image){ await imgBlock(it.image); }
    var ansLines=withAnswers?3:5;
    for(var a=0;a<ansLines;a++){ ensure(30); ctx.strokeStyle='#cbd5e1'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(M+8,y+12); ctx.lineTo(W-M,y+12); ctx.stroke(); y+=30; hasContent=true; }
  }
  if(withAnswers&&items.length){
    ensure(20);
    line('参考答案与解析','bold 26px '+fb,'#0f766e',W-2*M,48,'left');
    for(var b=0;b<items.length;b++){
      var it2=items[b];
      line('第 '+(b+1)+' 题 · '+subj(it2.subjectId).name+(it2.tag?' · '+it2.tag:'')+(it2.reason?'　[错因：'+it2.reason+']':''),'bold 17px '+fb,'#111827',W-2*M,34,'left');
      line(it2.answer||'', '17px '+fb, '#334155', W-2*M, 30, 'left');
      if(it2.aImage){ await imgBlock(it2.aImage); }
    }
  }
  flushLast();
  if(!pages.length){ return null; }
  return buildPdf(pages);
}
function paperWeight(m){
  var iv=reviewIntervals();
  var maxSt=Math.max(1,iv.length);
  var od=diffDays(m.dueDate, todayStr());
  var dueBoost=1;
  if(od>=0) dueBoost += Math.min(3, od+1);
  var stageF = maxSt / (m.stage+1);
  var rec=1;
  m.history.slice(-3).forEach(function(x){ rec *= x.correct?0.85:1.4; });
  return dueBoost * stageF * rec;
}
function weightedPick(list,n){
  var arr=list.slice(), res=[], guard=0;
  while(res.length<n && arr.length && guard++<10000){
    var ws=arr.map(paperWeight), tot=0;
    for(var i=0;i<ws.length;i++)tot+=ws[i];
    var r=Math.random()*tot, acc=0, idx=0;
    for(i=0;i<ws.length;i++){ acc+=ws[i]; if(r<=acc){ idx=i; break; } }
    res.push(arr[idx]); arr.splice(idx,1);
  }
  return res;
}

function makePaper(){

  if(!all.length){ toast('没有未掌握的图片错题，先录入并复习吧'); return; }

  var pool;
  if(sel!=='auto'){ pool=bySub[sel]||[]; }

    var best='',bestN=-1;

function compressImageFile(file,cb){ var img=new Image(); var url=URL.createObjectURL(file); img.onload=function(){ URL.revokeObjectURL(url); try{ var MAX=1200; var w=img.naturalWidth||img.width,h=img.naturalHeight||img.height; var sc=Math.min(1,MAX/Math.max(w,h)); w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc)); var c=document.createElement('canvas'); c.width=w;c.height=h; var ctx=c.getContext('2d'); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h); cb(c.toDataURL('image/jpeg',0.7)); }catch(e){ toast('图片处理失败'); cb(null); } }; img.onerror=function(){ URL.revokeObjectURL(url); toast('无法读取图片'); cb(null); }; img.src=url; }

async function processMistakeImage(mode){
  if(!ui.mImgData){ toast('请先添加图片'); return; }
  toast('图片处理中…');
  try{
    var im=await loadImgFromData(ui.mImgData);
    var W=im.naturalWidth||im.width, H=im.naturalHeight||im.height;
    var out=document.createElement('canvas'); out.width=W; out.height=H;
    var x=out.getContext('2d',{willReadFrequently:true});
    x.fillStyle='#ffffff'; x.fillRect(0,0,W,H); x.drawImage(im,0,0);
    var srcData=x.getImageData(0,0,W,H).data;
    var gray=new Float32Array(W*H);
    for(var i=0;i<W*H;i++){ var j=i*4; gray[i]=0.299*srcData[j]+0.587*srcData[j+1]+0.114*srcData[j+2]; }
    // 估计背景（缩小再放大 = 近似模糊）用于去阴影
    var sm=32;
    var small=document.createElement('canvas'); small.width=sm; small.height=sm;
    var sx2=small.getContext('2d');
    var flat=document.createElement('canvas'); flat.width=W; flat.height=H;
    var fx=flat.getContext('2d');
    var sd=new Uint8ClampedArray(W*H*4);
    for(var m=0;m<W*H;m++){ sd[m*4]=gray[m]; sd[m*4+1]=gray[m]; sd[m*4+2]=gray[m]; sd[m*4+3]=255; }
    fx.putImageData(new ImageData(sd,W,H),0,0);
    sx2.imageSmoothingEnabled=true; sx2.drawImage(flat,0,0,sm,sm);
    var bg=document.createElement('canvas'); bg.width=W; bg.height=H;
    var bx=bg.getContext('2d'); bx.imageSmoothingEnabled=true; bx.drawImage(small,0,0,W,H);
    var bd=bx.getImageData(0,0,W,H).data;
    var od=out.getContext('2d').createImageData(W,H); var p=od.data;
    function cl(v){ return v<0?0:(v>255?255:v); }
    for(var n=0;n<W*H;n++){
      var bgv=bd[n*4]||255;
      var v=bgv>1?((gray[n]/bgv)*230):gray[n];
      v=cl(v);
      if(mode==='bin'){ v=v>155?255:0; } else { v=cl((v-128)*1.45+128); }
      p[n*4]=v; p[n*4+1]=v; p[n*4+2]=v; p[n*4+3]=255;
    }
    out.getContext('2d').putImageData(od,0,0);
    ui.mImgData=out.toDataURL('image/jpeg',0.85);
    ui.mImgProc=(mode==='bin')?'图片（黑白印刷增强）':'图片（去阴影/对比增强）';
    showMistakeImg();
    toast(mode==='bin'?'已生成黑白增强版，可继续OCR':'已去阴影并增强对比度');
  }catch(e){ toast('图片处理失败'); }
}
async function runOcr(){

  try{
    if(!window.Tesseract){ toast('正在加载 OCR 引擎（首次较慢）…'); await loadScriptOnce('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'); }

    case 'nextday': { var nx=addDays(ui.viewDate,1); if(nx>todayStr()){ toast('不能查看未来的日期'); break; } ui.viewDate=nx; renderActive(); break; }
    case 'todayday': ui.viewDate=todayStr(); renderActive(); break;
    case 'pset': { var mn=parseInt(el.getAttribute('data-min'),10); if(mn>0){ timer.dur=mn; saveTimer(); renderPomo(); } break; }
    case 'pstart': case 'ppause': case 'presume': case 'psave': case 'pdrop': case 'pskip': case 'pbreak': case 'pnext': case 'pend': actionPomo(act,el); break;
    case 'tasktoggle': { var t=dayRec(ui.viewDate).tasks.find(function(x){return x.id===id;}); if(t){ t.status=t.status==='done'?'todo':'done'; save(); renderTasks(); renderTodaySummary(); } break; }
    case 'taskab': { var t2=dayRec(ui.viewDate).tasks.find(function(x){return x.id===id;}); if(t2){ t2.status=t2.status==='abandoned'?'todo':'abandoned'; save(); renderTasks(); renderTodaySummary(); } break; }
    case 'taskedit': taskEditStart(id); break;
    case 'taskdel': { if(!confirm('删除这条任务？'))break; var arr=dayRec(ui.viewDate).tasks; var idx=arr.findIndex(function(x){return x.id===id;}); if(idx>=0){ arr.splice(idx,1); save(); renderTasks(); renderTodaySummary(); } break; }
    case 'delsession': { var arr2=dayRec(ui.viewDate).sessions; var i2=arr2.findIndex(function(x){return x.id===id;}); if(i2>=0){ arr2.splice(i2,1); save(); renderSessions(); renderTodaySummary(); } break; }
    case 'delpractice': { var arr3=dayRec(ui.viewDate).practice; var i3=arr3.findIndex(function(x){return x.id===id;}); if(i3>=0){ arr3.splice(i3,1); save(); renderPractice(); refreshTagDatalists(); } break; }
    case 'startreview': switchTab('mlist'); setTimeout(function(){ startReview(null); },30); break;
    case 'mreview': switchTab('mlist'); setTimeout(function(){ startReview(id); },30); break;
    case 'exitreview': exitReview(); break;
    case 'mreveal': if(ui.review){ ui.review.revealed=true; renderReview(); } break;
    case 'mright': gradeReview(true); break;
    case 'mwrong': gradeReview(false); break;
    case 'medit': ui.returnTo='mlist'; switchTab('mistake'); openMistakeEditor(id); break;
    case 'mdel': { var m=mistakeFind(id); if(m&&confirm('删除这道错题？其复习记录也会一并删除。')){ data.mistakes=data.mistakes.filter(function(x){return x.id!==id;}); save(); renderMistakes(); } break; }
    case 'mopen': ui.mOpenId=(ui.mOpenId===id)?null:id; renderMistakeList(); break;
    case 'makepaper': makePaper(); break;
    case 'papermark': markPaperResult(parseInt(el.getAttribute('data-i'),10), el.getAttribute('data-ok')==='1'); break;
    case 'mimgclear': { var sl=el.getAttribute('data-slot')||'q'; if(sl==='a'){ ui.mAImg=null; ui.mAProc=''; var ai2=$('#m-aimg'); if(ai2)ai2.value=''; } else { ui.mQImg=null; ui.mQProc=''; var qi2=$('#m-qimg'); if(qi2)qi2.value=''; } showMistakePhoto(sl); break; }
    case 'openshot': { window.__pendingShot=el.getAttribute('data-slot')==='a'?'a':'q'; var sId=el.getAttribute('data-slot')==='a'?'m-aimg':'m-qimg'; var inp=document.getElementById(sId); if(inp)inp.click(); break; }
    case 'imgproc': { var md=el.getAttribute('data-mode'); if(md==='ocr'){ runOcr(); } else { processMistakeImage(md); } break; }
    case 'sdel': deleteSubject(parseInt(el.getAttribute('data-i'),10)); break;
    case 'idel': deleteInterval(parseInt(el.getAttribute('data-i'),10)); break;
    case 'addsubject': addSubject(); break;
    case 'addinterval': addInterval(); break;
  }
}

/* ============ 初始化 ============ */
function bindEvents(){
  document.addEventListener('click',function(e){ var el=e.target.closest('[data-act]'); if(!el)return; handleAct(el.getAttribute('data-act'),el); });
  document.addEventListener('click',function(e){ var b=e.target.closest('#stats-range button'); if(b){ ui.statsRange=parseInt(b.getAttribute('data-range'),10)||7; renderStats(); } });
  $('#task-form').addEventListener('submit',function(e){ e.preventDefault(); submitTask(); });
  $('#practice-form').addEventListener('submit',function(e){ e.preventDefault(); submitPractice(); });
  $('#manual-form').addEventListener('submit',function(e){ e.preventDefault(); submitManual(); });
  $('#m-form').addEventListener('submit',function(e){ e.preventDefault(); submitMistake(); });
  var cancelBtn=document.createElement('button'); cancelBtn.type='button'; cancelBtn.className='btn ghost reveal-hide'; cancelBtn.id='task-cancel-edit'; cancelBtn.textContent='取消编辑'; cancelBtn.addEventListener('click',taskEditCancel); $('#task-form').appendChild(cancelBtn);
  var noteTimer=null;
  $('#day-note').addEventListener('input',function(){ var v=this.value,d=ui.viewDate; clearTimeout(noteTimer); noteTimer=setTimeout(function(){ dayRec(d).note=v; save(); },500); });
  var mc=$('#m-cancel'); if(mc)mc.addEventListener('click',function(){ var t=ui.returnTo; ui.returnTo=null; clearMistakeForm(); if(t)switchTab(t); });
  $('#m-qimg').addEventListener('change',function(){ var f=this.files&&this.files[0]; if(!f){ return; } compressImageFile(f,function(durl){ if(durl){ ui.mQImg=durl; ui.mQProc='题目照片（已压缩，可长按列表重新拍）'; showMistakePhoto('q'); toast('题目照已添加'); } }); });
  $('#m-aimg').addEventListener('change',function(){ var f=this.files&&this.files[0]; if(!f){ return; } compressImageFile(f,function(durl){ if(durl){ ui.mAImg=durl; ui.mAProc='答案解析照（已压缩）'; showMistakePhoto('a'); toast('答案解析照已添加'); } }); });
  ['task-subject','practice-subject','manual-subject','m-subject'].forEach(function(sid){ var el=document.getElementById(sid); if(el)el.addEventListener('change',refreshTagDatalists); });
  $('#set-goal').addEventListener('change',function(){ data.settings.dailyGoalMin=clampInt(this.value,1,1440,480); save(); renderTodaySummary(); });
  $('#set-exam').addEventListener('change',function(){ data.settings.examDate=this.value||''; save(); renderTodaySummary(); });
  $('#set-theme').addEventListener('change',function(){ data.settings.theme=this.value; save(); applyTheme(); });
  var bgEl=$('#set-bg'); if(bgEl)bgEl.addEventListener('change',function(){ data.settings.useDailyBg=this.checked; save(); if(ui.tab==='home')renderHome(); });
  $('#pom-focus').addEventListener('change',function(){ data.settings.pomodoro.focus=clampInt(this.value,1,180,25); save(); renderPomo(); });
  $('#pom-short').addEventListener('change',function(){ data.settings.pomodoro.short=clampInt(this.value,1,60,5); save(); renderPomo(); });
  $('#pom-long').addEventListener('change',function(){ data.settings.pomodoro.long=clampInt(this.value,1,120,15); save(); renderPomo(); });
  $('#pom-every').addEventListener('change',function(){ data.settings.pomodoro.longEvery=clampInt(this.value,1,12,4); save(); });
  $('#subjects-list').addEventListener('input',function(e){ var t=e.target; if(t.classList&&t.classList.contains('sn')){ var i=parseInt(t.getAttribute('data-i'),10); if(data.settings.subjects[i]){ data.settings.subjects[i].name=t.value||'未命名'; save(); } } });
  $('#subjects-list').addEventListener('change',function(e){ var t=e.target; if(t.classList&&t.classList.contains('sc')){ var i=parseInt(t.getAttribute('data-i'),10); if(data.settings.subjects[i]){ data.settings.subjects[i].color=t.value; save(); } } });
  $('#intervals-list').addEventListener('change',function(e){ var t=e.target; if(t.classList&&t.classList.contains('intv')){ var i=parseInt(t.getAttribute('data-i'),10); data.settings.reviewIntervals[i]=clampInt(t.value,1,365,1); save(); } });
  $('#btn-export').addEventListener('click',exportData);
  $('#btn-import').addEventListener('click',function(){ $('#file-import').click(); });
  $('#file-import').addEventListener('change',function(){ if(this.files&&this.files[0])importFile(this.files[0]); this.value=''; });
  $('#btn-clear').addEventListener('click',clearAllData);
  if(window.matchMedia){ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){ if(data.settings.theme==='auto')applyTheme(); }); }
}
function init(){
  loadData(); loadTimer(); applyTheme();
  document.body.innerHTML=LAYOUT;
  var w0=document.querySelector('.wrap'); if(w0)w0.setAttribute('data-card','dark');

  document.documentElement.style.setProperty('--bR',222);
  document.documentElement.style.setProperty('--bG',228);
  document.documentElement.style.setProperty('--bB',247);
  bindEvents();
  loadLaunch(); pickLaunchRandom();
  switchTab('home');
  setInterval(tickPomo,250);
  if(timer.phase!=='idle'){ if(timer.running&&remainingMs()<=0){ completePhase(); } else { renderPomo(); } }
  updateStoreMeter();
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && location.search.indexOf('debug')<0){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
}
if(typeof document!=='undefined'&&document.body){ init(); }
</script>
